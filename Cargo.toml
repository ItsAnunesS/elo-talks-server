[package]
name = "elo-talks-server"
version = "0.2.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Local authenticated API for Elo Talks"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
pem = "4"
rand = "0.10"
rcgen = "0.14"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["cors", "limit"] }
url = "2"
utoipa = { version = "6", features = ["uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
