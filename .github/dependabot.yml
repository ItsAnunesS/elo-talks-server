version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: release
    # Cargo's existing semver ranges define compatible automatic updates.
    # Cryptography/API migrations require an explicit manifest change and review.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: release
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
  - package-ecosystem: github-actions
    directory: /
    target-branch: release
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /
    target-branch: release
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
